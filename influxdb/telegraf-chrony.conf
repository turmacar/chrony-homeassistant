# DEPRECATED: removed from the Unraid Telegraf config (2026-08-27).
# chrony_tracking (from telegraf/pihole.conf's mqtt_consumer, which runs
# directly on the Pi) already provides every field here plus host/leap_status/
# ref_source tags, making this redundant. Kept for reference only.
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["chrony/pihole/state"]
  username = "YOUR_MQTT_USERNAME"
  password = "YOUR_MQTT_PASSWORD"
  qos = 0
  client_id = "telegraf-chrony"
  data_format = "json"
  name_override = "chrony_state"
  tagexclude = ["host"]
