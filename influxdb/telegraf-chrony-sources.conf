# Ingest each object in the chrony sources array as a tagged Influx series.
# Uses the same ${MQTT_HOST} / ${TELEGRAF_MQTT_PASSWORD} env vars as
# telegraf-homeassistant's telegraf confs; set them via EnvironmentFile.
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["chrony/pihole/sources"]
  username = "telegraf"
  password = "${TELEGRAF_MQTT_PASSWORD}"
  qos = 0
  client_id = "telegraf-chrony-sources"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "chrony_source"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "#"
      tags = ["mode", "state", "name", "reach_human"]
      fields = {stratum = "int", poll = "int", reach = "string", last_rx = "string", offset = "float", offset_stdev = "float", margin = "float"}
